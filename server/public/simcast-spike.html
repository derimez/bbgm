<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<title>BBGM Simcast Spike</title>
		<style>
			:root {
				color-scheme: dark;
			}
			html,
			body {
				margin: 0;
				padding: 0;
				background: #0c0e12;
				color: #d8dde7;
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
			}
			body {
				display: flex;
				flex-direction: column;
				align-items: center;
				padding: 12px 12px 24px;
				gap: 10px;
				min-height: 100vh;
			}
			h1 {
				margin: 4px 0 0;
				font-size: 18px;
				font-weight: 600;
				letter-spacing: 0.02em;
			}
			.sub {
				margin: 0;
				font-size: 11px;
				color: #7c8597;
			}
			#stage {
				width: 100%;
				position: relative;
				/* cap width so stage never gets taller than (svh − header) — fixes iOS landscape overflow */
				max-width: min(940px, calc((100svh - 110px) * 94 / 50));
				aspect-ratio: 94 / 50;
				margin: 0 auto;
				background: #0c0e12;
				border-radius: 8px;
				overflow: hidden;
				box-shadow:
					0 1px 0 #1d2230 inset,
					0 8px 24px rgba(0, 0, 0, 0.4);
			}
			#stage canvas {
				display: block;
				width: 100% !important;
				height: 100% !important;
				/* let vertical page scroll pass through touch events on the canvas */
				touch-action: pan-y;
			}
			/* Stage corner buttons (refresh top-left, fullscreen top-right) */
			.stage-btn {
				position: absolute;
				top: 8px;
				z-index: 10;
				width: 32px;
				height: 32px;
				padding: 0;
				border-radius: 6px;
				background: rgba(20, 24, 35, 0.75);
				border: 1px solid rgba(255, 255, 255, 0.15);
				color: #d8dde7;
				cursor: pointer;
				display: grid;
				place-items: center;
				-webkit-tap-highlight-color: transparent;
			}
			.stage-btn:hover {
				background: rgba(40, 49, 66, 0.85);
			}
			.stage-btn svg {
				width: 16px;
				height: 16px;
				stroke: currentColor;
				fill: none;
				stroke-width: 2;
				stroke-linecap: round;
				stroke-linejoin: round;
			}
			#reload-btn {
				left: 8px;
			}
			#replay {
				right: 48px;
			}
			#fs-toggle {
				right: 8px;
			}
			/* Fake fullscreen (works on iPhone where real Fullscreen API is video-only) */
			body.fs {
				overflow: hidden;
			}
			body.fs::before {
				content: "";
				position: fixed;
				inset: 0;
				background: #000;
				z-index: 999;
			}
			body.fs #stage {
				position: fixed;
				inset: 0;
				margin: auto;
				width: min(100vw, calc(100svh * 94 / 50));
				height: min(100svh, calc(100vw * 50 / 94));
				max-width: none;
				border-radius: 0;
				z-index: 1000;
			}
			body.fs h1,
			body.fs .sub {
				display: none;
			}
			/* FS overlay: a single panel split into 4 columns by dividers. */
			:root {
				--fs-card-h: 58px;
				--fs-handle-h: 20px;
			}
			body.fs .overlay {
				position: fixed;
				z-index: 1001;
				left: 50%;
				transform: translateX(-50%);
				bottom: env(safe-area-inset-bottom);
				width: min(calc(100vw - 16px), calc(100svh * 94 / 50 - 16px));
				height: var(--fs-card-h);
				background: rgba(14, 18, 28, 0.2);
				-webkit-backdrop-filter: blur(1px) saturate(130%);
				backdrop-filter: blur(1px) saturate(130%);
				border: 1px solid rgba(255, 255, 255, 0.12);
				border-bottom: none;
				border-radius: 10px 10px 0 0;
				flex-wrap: nowrap;
				gap: 0;
				padding: 0;
				pointer-events: auto;
				transition:
					transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1),
					opacity 0.25s ease;
				will-change: transform;
			}
			body.fs.overlay-collapsed .overlay {
				transform: translateX(-50%) translateY(calc(100% + var(--fs-handle-h)));
				opacity: 0;
				pointer-events: none;
			}
			body.fs .card {
				background: transparent;
				border: none;
				border-right: 1px solid rgba(255, 255, 255, 0.1);
				padding: 0 10px;
				min-width: 0;
				/* Locked vertical grid: 14px header row + 24px value row → all columns
       align on the same horizontal baselines regardless of internal content */
				display: grid;
				grid-template-rows: 14px 24px;
				align-content: center;
				justify-items: center;
				row-gap: 2px;
				color: #fff;
				text-align: center;
				text-shadow: none;
				-webkit-text-stroke: 0.8px #000;
				text-stroke: 0.8px #000;
				paint-order: stroke fill;
			}
			body.fs .card:last-child {
				border-right: none;
			}
			body.fs .card * {
				color: #fff !important;
				text-shadow: none !important;
			}
			/* Column widths: clock + speed snug, score wide enough for XXX  XXX, last play grows */
			body.fs .overlay .card:nth-child(1) {
				flex: 0 0 auto;
				min-width: 80px;
			} /* CLOCK    */
			body.fs .overlay .card:nth-child(2) {
				flex: 1 1 0;
			} /* LAST PLAY */
			body.fs .overlay .card:nth-child(3) {
				flex: 0 0 auto;
				min-width: 148px;
			} /* SCORE    */
			body.fs .overlay .card:nth-child(4) {
				flex: 0 0 auto;
				min-width: 80px;
			} /* SPEED    */
			/* Section titles — larger and uniform */
			body.fs .card h2 {
				font-size: 11px;
				margin: 0;
				letter-spacing: 0.14em;
				font-weight: 700;
				line-height: 14px;
				-webkit-text-stroke: 0.5px #000;
			}
			/* One typographic rule for all three numeric values — guarantees baseline parity */
			body.fs .clock,
			body.fs .score .pts,
			body.fs .speed .val {
				font-size: 22px;
				font-weight: 700;
				line-height: 24px;
				font-variant-numeric: tabular-nums;
				width: auto;
				display: inline-block;
			}
			/* Last-play single line, larger now that the column is wider */
			body.fs .play {
				font-size: 15px;
				line-height: 24px;
				font-weight: 500;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				max-width: 100%;
				display: inline-block;
			}
			/* Score: flatten the nested wrappers so NYK 0 LAL 0 sits on one 24px-tall row,
     aligned with clock/speed values across the strip */
			body.fs .score {
				display: flex;
				align-items: baseline;
				gap: 6px;
				justify-content: center;
				height: 24px;
				line-height: 24px;
			}
			body.fs .score > div {
				display: contents;
			}
			body.fs .score .team {
				font-size: 12px;
				font-weight: 700;
				letter-spacing: 0.08em;
				opacity: 0.9;
				-webkit-text-stroke: 0.5px #000;
				align-self: baseline;
			}
			/* Collapse the .speed wrapper so .val becomes a direct grid child like .clock —
     same line-height, same baseline. */
			body.fs .speed {
				display: contents;
			}
			body.fs .speed input[type="range"] {
				display: none;
			}

			/* Pull-handle: visible only in FS mode. Sits on top of overlay when expanded;
     drops to the viewport bottom when collapsed. */
			#fs-collapse {
				display: none;
				position: fixed;
				z-index: 1002;
				left: 50%;
				transform: translateX(-50%);
				bottom: calc(env(safe-area-inset-bottom) + var(--fs-card-h));
				width: 64px;
				height: var(--fs-handle-h);
				background: rgba(14, 18, 28, 0.45);
				-webkit-backdrop-filter: blur(3px);
				backdrop-filter: blur(3px);
				border: 1px solid rgba(255, 255, 255, 0.15);
				border-bottom: none;
				border-radius: 10px 10px 0 0;
				align-items: center;
				justify-content: center;
				padding: 0;
				cursor: pointer;
				color: #fff;
				-webkit-tap-highlight-color: transparent;
				transition: bottom 0.35s cubic-bezier(0.2, 0.7, 0.2, 1);
			}
			body.fs #fs-collapse {
				display: flex;
			}
			body.fs.overlay-collapsed #fs-collapse {
				bottom: env(safe-area-inset-bottom);
			}
			#fs-collapse svg {
				width: 16px;
				height: 12px;
				stroke: #fff;
				fill: none;
				stroke-width: 2.2;
				stroke-linecap: round;
				stroke-linejoin: round;
				transition: transform 0.3s cubic-bezier(0.2, 0.7, 0.2, 1);
			}
			body.fs.overlay-collapsed #fs-collapse svg {
				transform: rotate(180deg);
			}
			.overlay {
				width: 100%;
				max-width: 940px;
				display: flex;
				gap: 10px;
				justify-content: space-between;
				align-items: stretch;
				flex-wrap: wrap;
			}
			.card {
				background: #141823;
				border: 1px solid #1d2230;
				border-radius: 8px;
				padding: 10px 12px;
				flex: 1 1 200px;
			}
			.card h2 {
				font-size: 10px;
				margin: 0 0 4px;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				color: #7c8597;
				font-weight: 600;
			}
			.clock {
				font-variant-numeric: tabular-nums;
				font-size: 22px;
				font-weight: 700;
			}
			.play {
				font-size: 13px;
				color: #b9c0cf;
				min-height: 1.2em;
			}
			.score {
				display: flex;
				gap: 14px;
				align-items: baseline;
			}
			.score .team {
				font-size: 11px;
				color: #7c8597;
			}
			.score .pts {
				font-size: 22px;
				font-weight: 700;
				font-variant-numeric: tabular-nums;
			}
			.speed {
				display: flex;
				align-items: center;
				gap: 10px;
			}
			.speed input[type="range"] {
				flex: 1;
			}
			.speed .val {
				width: 42px;
				text-align: right;
				font-variant-numeric: tabular-nums;
			}
		</style>
	</head>
	<body>
		<h1>BBGM Simcast — Phase 2 Spike</h1>
		<p class="sub">
			Hardcoded play on MSG IV (1986-91 Knicks floor) · per-season + NBA Cup
			catalog in Phase 3
		</p>

		<div id="stage">
			<button
				id="reload-btn"
				class="stage-btn"
				aria-label="Reload"
				title="Reload"
			>
				<svg viewBox="0 0 24 24">
					<path d="M21 12a9 9 0 1 1-3.2-6.9M21 4v5h-5" />
				</svg>
			</button>
			<button id="replay" class="stage-btn" aria-label="Replay" title="Replay">
				<svg viewBox="0 0 24 24">
					<path
						d="M11 18V6l-8 6 8 6zM21 18V6l-8 6 8 6z"
						fill="currentColor"
						stroke="none"
					/>
				</svg>
			</button>
			<button
				id="fs-toggle"
				class="stage-btn"
				aria-label="Toggle full screen"
				title="Full screen"
			>
				<svg viewBox="0 0 24 24">
					<path id="fs-icon-enter" d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
				</svg>
			</button>
		</div>

		<button id="fs-collapse" aria-label="Collapse controls" title="Collapse">
			<svg viewBox="0 0 24 16"><path d="M4 11l8 -6 8 6" /></svg>
		</button>
		<div class="overlay">
			<div class="card">
				<h2>Clock</h2>
				<div class="clock" id="clock">12:00</div>
				<div class="sub" id="quarter">Q1</div>
			</div>
			<div class="card">
				<h2>Last Play</h2>
				<div class="play" id="play">Tip-off · NYK ball</div>
			</div>
			<div class="card">
				<h2>Score</h2>
				<div class="score">
					<div>
						<div class="team">NYK</div>
						<div class="pts" id="score-home">0</div>
					</div>
					<div>
						<div class="team">LAL</div>
						<div class="pts" id="score-away">0</div>
					</div>
				</div>
			</div>
			<div class="card">
				<h2>Speed</h2>
				<div class="speed">
					<input
						type="range"
						id="speed"
						min="0.25"
						max="3"
						step="0.25"
						value="1"
					/>
					<span class="val" id="speed-val">1.0×</span>
				</div>
			</div>
		</div>

		<script type="module">
			import * as PIXI from "https://cdn.jsdelivr.net/npm/pixi.js@8.5.2/dist/pixi.min.mjs";

			// ─────────────────────────────────────────────────────────────────────────────
			// Court constants (NBA dimensions, in feet). Origin: top-left of court rect.
			// x: 0..94 (length, baseline to baseline). y: 0..50 (sideline to sideline).
			const COURT = {
				length: 94,
				width: 50,
				laneWidth: 16,
				laneLength: 19, // 19' from baseline to FT line
				ftCircleR: 6,
				threeArcR: 23.75,
				cornerThreeY: 3, // corner 3 distance from sideline
				cornerThreeX: 14, // corner 3 length from baseline
				basketFromBaseline: 5.25,
				hoopR: 0.75,
			};

			const COLORS = {
				bg: 0x0c0e12,
				home: 0x006bb6, // Knicks blue
				homeRing: 0xf58426, // Knicks orange (secondary)
				away: 0xfdb927, // Lakers gold
				awayRing: 0x552583, // Lakers purple (secondary)
				ball: 0xe25822,
				ballLt: 0xff8e3c,
			};

			// Court texture + the inset that maps the image's playing surface to (0,0)–(94,50).
			// Each entry: left/right/top/bottom in normalized image coords (0..1) of the inner
			// edge of the white sideline/baseline. Phase 3 will turn this into a per-season catalog.
			const COURT_TEXTURE = "/simcast-spike/static/courts/msg-1986-1991.jpg";
			// Measured empirically (getImageData scan): playing surface 791×424 px, aspect 1.866 (≈NBA 1.88).
			const COURT_INSET = {
				left: 116 / 1024,
				right: 907 / 1024,
				top: 40 / 505,
				bottom: 464 / 505,
			};

			// 1985–86 Knicks / Lakers — heights in inches drive dot radius.
			const HOME = [
				{ id: "h1", pos: "PG", lbl: "Sparrow", h: 74 }, // 6'2"
				{ id: "h2", pos: "SG", lbl: "Wilkins", h: 78 }, // 6'6"
				{ id: "h3", pos: "SF", lbl: "King", h: 79 }, // 6'7"
				{ id: "h4", pos: "PF", lbl: "Orr", h: 80 }, // 6'8"
				{ id: "h5", pos: "C", lbl: "Ewing", h: 84 }, // 7'0"
			];
			const AWAY = [
				{ id: "a1", pos: "PG", lbl: "Magic", h: 81 }, // 6'9"
				{ id: "a2", pos: "SG", lbl: "Scott", h: 76 }, // 6'4"
				{ id: "a3", pos: "SF", lbl: "Worthy", h: 81 }, // 6'9"
				{ id: "a4", pos: "PF", lbl: "Rambis", h: 80 }, // 6'8"
				{ id: "a5", pos: "C", lbl: "Kareem", h: 86 }, // 7'2"
			];

			// Dot radius in feet, scaled by height. 6'0" baseline + 0.06 ft per inch above.
			const dotRadius = (heightIn) => 1.05 + (heightIn - 72) * 0.06;

			// Starting positions in feet (Knicks attacking right basket at x≈88.75).
			// Defenders shade between man and basket.
			const POS_START = {
				h1: [22, 25],
				h2: [40, 12],
				h3: [52, 38],
				h4: [60, 30],
				h5: [55, 22],
				a1: [62, 25],
				a2: [70, 14],
				a3: [74, 36],
				a4: [80, 28],
				a5: [80, 24],
			};

			// ─────────────────────────────────────────────────────────────────────────────
			// Pixi app — scaled so 1 world unit = 1 foot
			const stageEl = document.getElementById("stage");
			const app = new PIXI.Application();
			await app.init({
				background: COLORS.bg,
				antialias: true,
				resizeTo: stageEl,
				autoDensity: true,
				resolution: Math.min(window.devicePixelRatio || 1, 2),
			});
			stageEl.appendChild(app.canvas);
			// Pixi v8 sets touch-action: none inline on the canvas, which blocks page scroll on iOS.
			// Override so vertical scrolling passes through.
			app.canvas.style.touchAction = "pan-y";

			const world = new PIXI.Container();
			app.stage.addChild(world);

			function layoutWorld() {
				const sx = app.renderer.width / COURT.length;
				const sy = app.renderer.height / COURT.width;
				const s = Math.min(sx, sy);
				world.scale.set(s, s);
				world.x = (app.renderer.width - COURT.length * s) / 2;
				world.y = (app.renderer.height - COURT.width * s) / 2;
			}
			app.renderer.on("resize", layoutWorld);
			layoutWorld();

			// ─── Court (textured) ───────────────────────────────────────────────────────
			// The court image's playing surface (inside the white baseline/sideline) maps
			// to (0,0)–(94,50). The blue apron extends past those bounds in world coords.
			async function loadCourtTexture() {
				const tex = await PIXI.Assets.load(COURT_TEXTURE);
				tex.source.scaleMode = "linear";
				const insetW = COURT_INSET.right - COURT_INSET.left;
				const insetH = COURT_INSET.bottom - COURT_INSET.top;
				const wFull = COURT.length / insetW;
				const hFull = COURT.width / insetH;
				const sprite = new PIXI.Sprite(tex);
				sprite.x = -COURT_INSET.left * wFull;
				sprite.y = -COURT_INSET.top * hFull;
				sprite.width = wFull;
				sprite.height = hFull;
				world.addChildAt(sprite, 0);
			}
			await loadCourtTexture();

			// ─── Debug overlay (toggle with ?debug=1) ──────────────────────────────────
			const DEBUG = new URLSearchParams(location.search).get("debug") === "1";
			if (DEBUG) {
				const g = new PIXI.Graphics();
				const mark = (x, y, color, label) => {
					g.circle(x, y, 0.8).stroke({ color, width: 0.25 });
					g.moveTo(x - 1.6, y)
						.lineTo(x + 1.6, y)
						.stroke({ color, width: 0.18 });
					g.moveTo(x, y - 1.6)
						.lineTo(x, y + 1.6)
						.stroke({ color, width: 0.18 });
					const t = new PIXI.Text({
						text: label,
						style: {
							fill: color,
							fontSize: 22,
							fontFamily: "system-ui",
							fontWeight: "700",
						},
					});
					t.anchor.set(0.5, 0);
					t.scale.set(0.06);
					t.position.set(x, y + 1.2);
					world.addChild(t);
				};
				// Court bounds (corners + sideline midpoints)
				const C = 0xff3b3b;
				mark(0, 0, C, "0,0");
				mark(94, 0, C, "94,0");
				mark(0, 50, C, "0,50");
				mark(94, 50, C, "94,50");
				mark(0, 25, C, "0,25");
				mark(94, 25, C, "94,25");
				// Half-court + center
				mark(47, 25, 0xffd000, "ctr");
				mark(47, 0, 0xffd000, "47,0");
				mark(47, 50, 0xffd000, "47,50");
				// Baskets (5.25 ft from baseline)
				mark(5.25, 25, 0xff7a00, "rim L");
				mark(88.75, 25, 0xff7a00, "rim R");
				// Free-throw lines (19 ft from baseline)
				mark(19, 25, 0x00d4ff, "FT L");
				mark(75, 25, 0x00d4ff, "FT R");
				world.addChild(g);
			}

			// ─── Players ────────────────────────────────────────────────────────────────
			const playerLayer = new PIXI.Container();
			world.addChild(playerLayer);

			const players = {}; // id -> { gfx, x, y, side, info, r }

			function makePlayer(info, side) {
				const cont = new PIXI.Container();
				const color = side === "home" ? COLORS.home : COLORS.away;
				const ringC = side === "home" ? COLORS.homeRing : COLORS.awayRing;
				const posTextC = side === "home" ? 0xffffff : COLORS.awayRing; // Lakers purple on gold
				const r = dotRadius(info.h);

				const dot = new PIXI.Graphics();
				dot.circle(0, 0, r).fill(color).stroke({ color: ringC, width: 0.32 });
				cont.addChild(dot);

				// Position inside the dot
				const posLabel = new PIXI.Text({
					text: info.pos,
					style: {
						fill: posTextC,
						fontSize: 32,
						fontFamily: "system-ui",
						fontWeight: "800",
						letterSpacing: -0.5,
					},
				});
				posLabel.anchor.set(0.5, 0.5);
				posLabel.scale.set(0.038);
				posLabel.position.set(0, 0);
				cont.addChild(posLabel);

				// Name below the dot, stroked so it reads on the wood floor
				const nameLabel = new PIXI.Text({
					text: info.lbl,
					style: {
						fill: 0xffffff,
						fontSize: 30,
						fontFamily: "system-ui",
						fontWeight: "700",
						stroke: { color: 0x000000, width: 5, alpha: 0.85 },
					},
				});
				nameLabel.anchor.set(0.5, 0);
				nameLabel.scale.set(0.055);
				nameLabel.position.set(0, r + 0.25);
				cont.addChild(nameLabel);

				playerLayer.addChild(cont);
				const [x, y] = POS_START[info.id];
				cont.position.set(x, y);
				return { gfx: cont, x, y, side, info, r };
			}

			for (const p of HOME) players[p.id] = makePlayer(p, "home");
			for (const p of AWAY) players[p.id] = makePlayer(p, "away");

			// ─── Ball ───────────────────────────────────────────────────────────────────
			const ballTex = await PIXI.Assets.load(
				"/simcast-spike/static/sprites/ball.png",
			);
			ballTex.source.scaleMode = "linear";
			const ballGfx = new PIXI.Sprite(ballTex);
			ballGfx.anchor.set(0.5, 0.5);
			ballGfx.width = 2.0; // ft — ~2.5× real 0.79 ft, easy to track without dominating
			ballGfx.height = 2.0;
			world.addChild(ballGfx);

			// shadow grows when ball is "in the air"
			const ballShadow = new PIXI.Graphics();
			ballShadow
				.ellipse(0, 0, 0.7, 0.35)
				.fill({ color: 0x000000, alpha: 0.35 });
			world.addChildAt(ballShadow, world.getChildIndex(playerLayer));

			let ball = { x: 22, y: 25, z: 0, carrier: "h1" }; // z = height in feet

			// ─── Play script ────────────────────────────────────────────────────────────
			// Each step: a time-bound transition. ease defaults to easeInOutQuad.
			// "move" repositions a player. "ball" tells the ball who to follow.
			// "arc" makes the ball travel through the air (sets z curve) to a target.
			// "say" sets the play description.

			const PLAY = [
				// 0–1s: inbound
				{ t: 0, say: "NYK inbound · Sparrow brings it up" },
				{ t: 0, moveTo: { id: "h1", x: 22, y: 25 } },
				{ t: 0, ballCarrier: "h1" },

				// 1–3.5s: PG dribbles up
				{ t: 1.0, moveTo: { id: "h1", x: 50, y: 27, dur: 2.5 } },
				{ t: 1.0, moveTo: { id: "a1", x: 58, y: 27, dur: 2.5 } },
				{ t: 1.0, moveTo: { id: "h2", x: 70, y: 10, dur: 2.5 } },
				{ t: 1.0, moveTo: { id: "a2", x: 73, y: 12, dur: 2.5 } },
				{ t: 1.0, moveTo: { id: "h3", x: 78, y: 40, dur: 2.5 } },
				{ t: 1.0, moveTo: { id: "a3", x: 80, y: 38, dur: 2.5 } },
				{ t: 1.0, moveTo: { id: "h5", x: 74, y: 22, dur: 2.5 } },
				{ t: 1.0, moveTo: { id: "a5", x: 78, y: 24, dur: 2.5 } },

				// 3.5–4.0s: pass to Wilkins on right wing
				{ t: 3.5, say: "Sparrow swings it to Wilkins on the wing" },
				{ t: 3.5, ballArc: { x: 70, y: 10, dur: 0.45, peak: 4 } },
				{ t: 3.95, ballCarrier: "h2" },

				// 4.0–6.0s: Wilkins drives baseline
				{ t: 4.0, moveTo: { id: "h2", x: 82, y: 6, dur: 1.8 } },
				{ t: 4.0, moveTo: { id: "a2", x: 84, y: 8, dur: 1.8 } },
				{ t: 4.0, moveTo: { id: "a5", x: 84, y: 22, dur: 1.8 } }, // C rotates to help
				{ t: 4.0, say: "Wilkins drives baseline" },

				// 5.9–6.4s: Ewing flashes to the right elbow (true high-post 18 ft area)
				{ t: 5.9, moveTo: { id: "h5", x: 72, y: 19, dur: 0.6 } },
				{ t: 6.0, ballArc: { x: 72, y: 19, dur: 0.4, peak: 3.5 } },
				{ t: 6.0, say: "Kick-out to Ewing at the elbow" },
				{ t: 6.4, ballCarrier: "h5" },

				// 6.4–7.5s: Kareem closes out · Ewing pivots into the turnaround
				{ t: 6.5, moveTo: { id: "a5", x: 76, y: 22, dur: 0.9 } },
				{ t: 6.8, moveTo: { id: "h5", x: 71, y: 19, dur: 0.7 } },

				// 7.5–8.5s: 18-ft turnaround — true rainbow to the rim
				{ t: 7.5, say: "Ewing · turnaround jumper from the elbow" },
				{ t: 7.6, ballCarrier: null },
				{ t: 7.6, ballArc: { x: 88.75, y: 25, dur: 1.0, peak: 12 } },

				// 8.5s: SCORE
				{ t: 8.6, score: { home: 2 } },
				{ t: 8.6, say: "GOOD! Ewing · 18 ft turnaround" },

				// 8.5–10s: hold for celebration / brief settle
				{ t: 8.5, moveTo: { id: "h5", x: 84, y: 25, dur: 1.0 } },
			];

			// ─── Animation engine ───────────────────────────────────────────────────────
			function easeInOutQuad(t) {
				return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
			}

			const tweens = []; // active player tweens
			const ballArcs = []; // active ball arcs
			let pendingEvents = [...PLAY];
			let elapsed = 0;
			let speed = 1;
			let scoreHome = 0,
				scoreAway = 0;
			let lastPlay = "Tip-off · NYK ball";
			let gameClock = 12 * 60; // seconds remaining in Q1

			const QUARTER_LEN = 12 * 60;
			const PLAY_DURATION = 10; // approx total play length

			const clockEl = document.getElementById("clock");
			const playEl = document.getElementById("play");
			const scoreH = document.getElementById("score-home");
			const scoreA = document.getElementById("score-away");
			const speedEl = document.getElementById("speed");
			const speedV = document.getElementById("speed-val");

			speedEl.addEventListener("input", () => {
				speed = parseFloat(speedEl.value);
				speedV.textContent = `${speed.toFixed(2).replace(/\.?0+$/, "")}×`;
			});
			document
				.getElementById("replay")
				.addEventListener("click", () => resetPlay());

			document
				.getElementById("reload-btn")
				.addEventListener("click", () => location.reload());

			// ─── Overlay collapse (FS-only pull handle) ─────────────────────────────────
			document.getElementById("fs-collapse").addEventListener("click", () => {
				document.body.classList.toggle("overlay-collapsed");
			});

			// In FS mode, slider is hidden — tap the speed cell to cycle through preset speeds.
			const SPEED_PRESETS = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3];
			const speedCard = document.querySelectorAll(".overlay .card")[3];
			speedCard.addEventListener("click", (e) => {
				if (!document.body.classList.contains("fs")) return;
				if (e.target.closest("button")) return; // ignore other button taps
				const cur = parseFloat(speedEl.value);
				let i = SPEED_PRESETS.findIndex((v) => v >= cur);
				if (i === -1) i = SPEED_PRESETS.length - 1;
				i = (i + 1) % SPEED_PRESETS.length;
				speed = SPEED_PRESETS[i];
				speedEl.value = speed;
				speedV.textContent = `${speed.toFixed(2).replace(/\.?0+$/, "")}×`;
			});

			// ─── Fullscreen toggle ──────────────────────────────────────────────────────
			const fsBtn = document.getElementById("fs-toggle");
			const fsIcon = document.getElementById("fs-icon-enter");
			const ENTER_D = "M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5";
			const EXIT_D = "M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5";
			const setFsState = (on) => {
				document.body.classList.toggle("fs", on);
				if (!on) document.body.classList.remove("overlay-collapsed"); // reset on exit
				fsIcon.setAttribute("d", on ? EXIT_D : ENTER_D);
				fsBtn.setAttribute("title", on ? "Exit full screen" : "Full screen");
				// Pixi resizes-to-stage automatically; nudge a render to settle new size
				setTimeout(
					() => app.renderer.resize(stageEl.clientWidth, stageEl.clientHeight),
					50,
				);
			};
			fsBtn.addEventListener("click", async () => {
				const isFs = document.body.classList.contains("fs");
				if (!isFs) {
					// Try real Fullscreen API first (desktop / iPad / Android); fall back to CSS fake-fs (iPhone)
					const el = document.documentElement;
					if (el.requestFullscreen) {
						try {
							await el.requestFullscreen();
						} catch {}
					} else if (el.webkitRequestFullscreen) {
						try {
							el.webkitRequestFullscreen();
						} catch {}
					}
					setFsState(true);
				} else {
					if (document.exitFullscreen) {
						try {
							await document.exitFullscreen();
						} catch {}
					} else if (document.webkitExitFullscreen) {
						try {
							document.webkitExitFullscreen();
						} catch {}
					}
					setFsState(false);
				}
			});
			// Keep CSS state synced if user exits via Esc / system gesture
			document.addEventListener("fullscreenchange", () => {
				if (
					!document.fullscreenElement &&
					document.body.classList.contains("fs")
				)
					setFsState(false);
			});

			function resetPlay() {
				elapsed = 0;
				tweens.length = 0;
				ballArcs.length = 0;
				pendingEvents = [...PLAY];
				scoreHome = 0;
				scoreAway = 0;
				scoreH.textContent = "0";
				scoreA.textContent = "0";
				for (const p of [...HOME, ...AWAY]) {
					const [x, y] = POS_START[p.id];
					players[p.id].gfx.position.set(x, y);
					players[p.id].x = x;
					players[p.id].y = y;
				}
				ball = { x: 22, y: 25, z: 0, carrier: "h1" };
				lastPlay = "Tip-off · NYK ball";
				playEl.textContent = lastPlay;
			}

			function fireEvent(e) {
				if (e.say !== undefined) {
					lastPlay = e.say;
					playEl.textContent = lastPlay;
				}
				if (e.moveTo) {
					const m = e.moveTo;
					const pl = players[m.id];
					tweens.push({
						id: m.id,
						x0: pl.x,
						y0: pl.y,
						x1: m.x,
						y1: m.y,
						t0: elapsed,
						dur: m.dur ?? 0.001,
					});
				}
				if (e.ballCarrier !== undefined) ball.carrier = e.ballCarrier;
				if (e.ballArc) {
					const a = e.ballArc;
					const start =
						ball.carrier && players[ball.carrier]
							? { x: players[ball.carrier].x, y: players[ball.carrier].y }
							: { x: ball.x, y: ball.y };
					ballArcs.push({
						x0: start.x,
						y0: start.y,
						x1: a.x,
						y1: a.y,
						peak: a.peak ?? 3,
						t0: elapsed,
						dur: a.dur,
					});
					ball.carrier = null;
				}
				if (e.score) {
					if (e.score.home) {
						scoreHome += e.score.home;
						scoreH.textContent = scoreHome;
					}
					if (e.score.away) {
						scoreAway += e.score.away;
						scoreA.textContent = scoreAway;
					}
				}
			}

			// Continuous idle drift for off-ball / non-tweening players (Tier 2)
			const driftSeeds = {};
			for (const id in players) driftSeeds[id] = Math.random() * Math.PI * 2;

			app.ticker.add((ticker) => {
				const dt = (ticker.deltaMS / 1000) * speed;
				elapsed += dt;

				// fire scheduled events
				while (pendingEvents.length && pendingEvents[0].t <= elapsed) {
					fireEvent(pendingEvents.shift());
				}

				// apply tweens
				for (let i = tweens.length - 1; i >= 0; i--) {
					const tw = tweens[i];
					const u = Math.min(1, (elapsed - tw.t0) / tw.dur);
					const e = easeInOutQuad(u);
					const pl = players[tw.id];
					pl.x = tw.x0 + (tw.x1 - tw.x0) * e;
					pl.y = tw.y0 + (tw.y1 - tw.y0) * e;
					pl.gfx.position.set(pl.x, pl.y);
					if (u >= 1) tweens.splice(i, 1);
				}

				// idle drift on anyone not currently tweening
				const moving = new Set(tweens.map((t) => t.id));
				for (const id in players) {
					if (moving.has(id)) continue;
					driftSeeds[id] += dt * 0.6;
					const pl = players[id];
					const dx = Math.cos(driftSeeds[id]) * 0.12 * dt;
					const dy = Math.sin(driftSeeds[id] * 1.3) * 0.1 * dt;
					pl.x += dx;
					pl.y += dy;
					pl.gfx.position.set(pl.x, pl.y);
				}

				// ball
				if (ball.carrier && players[ball.carrier]) {
					const c = players[ball.carrier];
					// hold position scales with the player's dot radius
					ball.x = c.x + c.r * 0.8;
					ball.y = c.y - c.r * 0.4;
					ball.z = 0;
				} else if (ballArcs.length) {
					const a = ballArcs[0];
					const u = Math.min(1, (elapsed - a.t0) / a.dur);
					ball.x = a.x0 + (a.x1 - a.x0) * u;
					ball.y = a.y0 + (a.y1 - a.y0) * u;
					ball.z = 4 * a.peak * u * (1 - u); // parabolic peak
					if (u >= 1) ballArcs.shift();
				}
				ballShadow.position.set(ball.x, ball.y);
				ballGfx.position.set(ball.x, ball.y - ball.z * 0.5);
				const shrink = 1 - Math.min(0.5, ball.z * 0.05);
				ballShadow.scale.set(shrink, shrink);

				// clock — runs across the duration of the scripted play, advancing 14 sec
				const playClockUsed = Math.min(elapsed / PLAY_DURATION, 1) * 14;
				const remaining = Math.max(0, QUARTER_LEN - playClockUsed);
				const mm = Math.floor(remaining / 60);
				const ss = Math.floor(remaining % 60);
				clockEl.textContent = `${mm}:${ss.toString().padStart(2, "0")}`;

				// auto-loop after a beat past the scripted play end
				if (elapsed > PLAY_DURATION + 2.5 && pendingEvents.length === 0) {
					resetPlay();
				}
			});
		</script>
	</body>
</html>
