<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<title>BBGM — Game Recaps</title>
		<style>
			:root {
				--bg: #0d1117;
				--panel: #161b22;
				--border: #30363d;
				--text: #e6edf3;
				--muted: #8b949e;
				--accent: #f78c2a;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				background: var(--bg);
				color: var(--text);
				font:
					15px/1.5 -apple-system,
					system-ui,
					Segoe UI,
					Roboto,
					sans-serif;
			}
			body {
				padding: max(16px, env(safe-area-inset-top)) 16px 48px;
				max-width: 760px;
				margin: 0 auto;
			}
			h1 {
				font-size: 20px;
				margin: 8px 0 16px;
			}
			h1 .sub {
				color: var(--muted);
				font-size: 13px;
				font-weight: 400;
			}
			a {
				color: var(--accent);
				text-decoration: none;
			}
			.list {
				display: flex;
				flex-direction: column;
				gap: 8px;
			}
			.game {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 12px;
				padding: 12px 14px;
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 10px;
				cursor: pointer;
				transition: border-color 0.15s;
			}
			.game:hover {
				border-color: var(--accent);
			}
			.matchup {
				font-weight: 600;
			}
			.score {
				font-variant-numeric: tabular-nums;
			}
			.win {
				color: var(--accent);
			}
			.badge {
				font-size: 11px;
				padding: 2px 7px;
				border-radius: 999px;
				border: 1px solid var(--border);
				color: var(--muted);
			}
			.badge.pending {
				color: #d29922;
				border-color: #d29922;
			}
			.badge.error {
				color: #f85149;
				border-color: #f85149;
			}
			.meta {
				color: var(--muted);
				font-size: 12px;
			}
			.empty {
				color: var(--muted);
				padding: 40px 0;
				text-align: center;
			}
			/* Detail view */
			#detail {
				display: none;
			}
			.back {
				display: inline-block;
				margin-bottom: 14px;
				font-size: 14px;
			}
			.card {
				background: var(--panel);
				border: 1px solid var(--border);
				border-radius: 12px;
				padding: 18px;
			}
			.final {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				font-size: 22px;
				font-weight: 700;
				margin-bottom: 4px;
			}
			.recap-text {
				white-space: pre-wrap;
				margin: 16px 0;
				line-height: 1.65;
			}
			table {
				width: 100%;
				border-collapse: collapse;
				font-size: 13px;
				margin-top: 12px;
			}
			th,
			td {
				text-align: right;
				padding: 5px 8px;
				border-bottom: 1px solid var(--border);
				font-variant-numeric: tabular-nums;
			}
			th:first-child,
			td:first-child {
				text-align: left;
			}
			caption {
				text-align: left;
				font-weight: 600;
				padding: 10px 0 4px;
			}
			.status-note {
				color: var(--muted);
				font-style: italic;
			}
		</style>
	</head>
	<body>
		<div id="list-view">
			<h1>Game Recaps <span class="sub">— BBGM</span></h1>
			<div id="list" class="list"></div>
		</div>

		<div id="detail">
			<a class="back" href="#">← All games</a>
			<div id="card" class="card"></div>
		</div>

		<script>
			const fmtDate = (ms) =>
				new Date(ms).toLocaleString(undefined, {
					month: "short",
					day: "numeric",
					hour: "numeric",
					minute: "2-digit",
				});

			async function loadList() {
				const list = document.getElementById("list");
				list.innerHTML = '<div class="empty">Loading…</div>';
				let rows;
				try {
					rows = await (await fetch("/api/recaps")).json();
				} catch {
					list.innerHTML = '<div class="empty">Could not load recaps.</div>';
					return;
				}
				if (!rows.length) {
					list.innerHTML =
						'<div class="empty">No completed games yet. Sim one with the simcast viewer open, then come back.</div>';
					return;
				}
				list.innerHTML = "";
				for (const r of rows) {
					const homeWin = r.home_score > r.away_score;
					const el = document.createElement("div");
					el.className = "game";
					el.innerHTML = `
						<div>
							<div class="matchup">${r.away_abbrev} @ ${r.home_abbrev}</div>
							<div class="meta">${r.season ? "Season " + r.season + " · " : ""}${fmtDate(r.created_at)}</div>
						</div>
						<div style="text-align:right">
							<div class="score">
								<span class="${homeWin ? "" : "win"}">${r.away_score}</span> –
								<span class="${homeWin ? "win" : ""}">${r.home_score}</span>
							</div>
							${r.status !== "done" ? `<span class="badge ${r.status}">${r.status}</span>` : ""}
						</div>`;
					el.onclick = () => {
						location.hash = "g" + r.gid;
					};
					list.appendChild(el);
				}
			}

			function statTable(box, t) {
				const s = box.team[t];
				const tops = box.topScorers[t]
					.map(
						(p) =>
							`<tr><td>${p.name}</td><td>${p.pts}</td><td>${p.ast}</td><td>${p.reb}</td></tr>`,
					)
					.join("");
				return `
					<table>
						<caption>${box.teams[t]} — ${box.score[t]} pts</caption>
						<thead><tr><th>Leaders</th><th>PTS</th><th>AST</th><th>REB</th></tr></thead>
						<tbody>${tops || '<tr><td colspan="4" class="status-note">no scorers</td></tr>'}</tbody>
					</table>
					<div class="meta" style="margin-top:6px">
						FG ${s.fgm}/${s.fga} · 3P ${s.tpm}/${s.tpa} · FT ${s.ftm}/${s.fta} ·
						AST ${s.ast} · REB ${s.reb} · TOV ${s.tov} · STL ${s.stl} · BLK ${s.blk}
					</div>`;
			}

			async function loadDetail(gid) {
				const card = document.getElementById("card");
				card.innerHTML = '<div class="empty">Loading…</div>';
				let r;
				try {
					const resp = await fetch("/api/recap/" + gid);
					if (!resp.ok) throw new Error();
					r = await resp.json();
				} catch {
					card.innerHTML = '<div class="empty">Recap not found.</div>';
					return;
				}
				const box = r.box;
				const homeWin = r.home_score > r.away_score;
				let body;
				if (r.status === "done") {
					body = `<div class="recap-text">${(r.recap_text ?? "").replace(/</g, "&lt;")}</div>`;
				} else if (r.status === "pending") {
					body = `<p class="status-note">Recap is generating… reload in a few seconds.</p>`;
				} else {
					body = `<p class="status-note">Recap generation failed: ${(r.recap_text ?? "unknown error").replace(/</g, "&lt;")}</p>`;
				}
				card.innerHTML = `
					<div class="final">
						<span class="${homeWin ? "" : "win"}">${r.away_abbrev} ${r.away_score}</span>
						<span class="${homeWin ? "win" : ""}">${r.home_score} ${r.home_abbrev}</span>
					</div>
					<div class="meta">${r.season ? "Season " + r.season + " · " : ""}${fmtDate(r.created_at)} · ${r.model ?? ""}</div>
					${body}
					${box ? statTable(box, 0) + statTable(box, 1) : ""}`;
			}

			function route() {
				const h = location.hash;
				const listView = document.getElementById("list-view");
				const detail = document.getElementById("detail");
				if (h.startsWith("#g")) {
					listView.style.display = "none";
					detail.style.display = "block";
					loadDetail(parseInt(h.slice(2), 10));
				} else {
					detail.style.display = "none";
					listView.style.display = "block";
					loadList();
				}
			}
			window.addEventListener("hashchange", route);
			route();
		</script>
	</body>
</html>
